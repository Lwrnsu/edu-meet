<!doctype html>
<html>
  <head>
    <title>Submissions</title>
  </head>
  <body>
    <h1>Student Submissions</h1>

    <div id="submissions"></div>

    <script>
      loadSubmissions();

      function loadSubmissions() {
        fetch("/api/submissions")
          .then((r) => r.json())
          .then((data) => {
            let html = "";

            data.forEach((s) => {
              html += `
<div style="border:1px solid black;padding:10px;margin:10px;">
<h3>${s.student_name}</h3>

<pre>${s.code}</pre>

<input id="score${s.id}" placeholder="Score">

<input id="comment${s.id}" placeholder="Comment">

<button onclick="grade(${s.id})">
Grade
</button>
</div>
`;
            });

            document.getElementById("submissions").innerHTML = html;
          });
      }

      function grade(id) {
        fetch("/api/grade", {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify({
            id: id,
            score: document.getElementById("score" + id).value,
            comment: document.getElementById("comment" + id).value,
          }),
        }).then(() => {
          alert("Graded");
          loadSubmissions();
        });
      }
    </script>
  </body>
</html>
