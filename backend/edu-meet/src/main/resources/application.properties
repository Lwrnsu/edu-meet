spring.application.name=edu-meet

# Gemini credentials for the assistant
gemini.api-key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

# Upload + message limits (the framework defaults to 1MB per file, which is
# smaller than most lecture PDFs)
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

# Application limits
edu-meet.chat.max-message-chars=4000
edu-meet.chat.max-pdf-bytes=8388608
edu-meet.pdf.max-pages=40
edu-meet.pdf.max-chars=60000

# Chat memory: keeps the process bounded
edu-meet.chat.max-sessions=200
edu-meet.chat.max-turns=12
edu-meet.chat.session-ttl-minutes=60
