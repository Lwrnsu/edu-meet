server.port=8080
spring.config.import=optional:file:../../.env[.properties]
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
compiler.api.url=https://api.onlinecompiler.io/api/run-code-sync/
compiler.api.key=b705a20cead2db665e3f855f571ecd9e
spring.application.name=edu-meet

spring.datasource.url=jdbc:mysql://mysql:3306/edu_meet
spring.datasource.username=root
spring.datasource.password=secret
spring.jpa.show-sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
app.php-class-database.url=${PHP_CLASS_DATABASE_URL:jdbc:mysql://localhost:3306/edu_meet}
app.php-class-database.username=${PHP_CLASS_DATABASE_USERNAME:${DB_USER:root}}
app.php-class-database.password=${PHP_CLASS_DATABASE_PASSWORD:${DB_PASSWORD:secret}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=edu-meet-dev-jwt-secret-key-change-me-32chars-min
app.jwt.expiration-ms=86400000

app.php.login-url=${APP_PHP_LOGIN_URL:http://localhost:8000/api/auth/login.php}
app.php.system-admin-login-url=${APP_PHP_SYSTEM_ADMIN_LOGIN_URL:http://localhost:8000/api/auth/system_admin_login.php}
app.php.school-login-url=${APP_PHP_SCHOOL_LOGIN_URL:http://localhost:8000/api/auth/school_login.php}
app.php.college-admin-login-url=http://localhost/edu-meet/php/api/auth/school_login.php
app.php.signup-url=${APP_PHP_SIGNUP_URL:http://localhost:8000/api/auth/signup.php}
app.php.base-url=${APP_PHP_BASE_URL:http://localhost:8000/api}
app.php.compiler-url=${APP_PHP_COMPILER_URL:http://localhost:8000/php_edumeet/}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
app.auth.token-ttl-seconds=86400
livekit.url=${LIVEKIT_URL:}
livekit.api-key=${LIVEKIT_API_KEY:}
livekit.api-secret=${LIVEKIT_API_SECRET:}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/edumeet}
spring.data.mongodb.auto-index-creation=true
app.frontend.allowed-origins=${EDUMEET_FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://edu-meet.app,https://edu-meet.app}
