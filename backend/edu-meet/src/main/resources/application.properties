
# ============================================================
# EDU-MEET APPLICATION CONFIGURATION
# ============================================================

server.port=8080
spring.application.name=edu-meet
spring.config.import=optional:file:../../.env[.properties]


# ============================================================
# FILE UPLOAD CONFIGURATION
# ============================================================

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB


# ============================================================
# ONLINE COMPILER API
# ============================================================

compiler.api.url=https://api.onlinecompiler.io/api/run-code-sync/
compiler.api.key=${COMPILER_API_KEY:}


# ============================================================
# GEMINI AI CONFIGURATION
# ============================================================

gemini.api-key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

# AI chat limits
edu-meet.chat.max-message-chars=4000
edu-meet.chat.max-pdf-bytes=8388608
edu-meet.pdf.max-pages=40
edu-meet.pdf.max-chars=60000

# AI chat memory
edu-meet.chat.max-sessions=200
edu-meet.chat.max-turns=12
edu-meet.chat.session-ttl-minutes=60


# ============================================================
# MYSQL DATABASE CONFIGURATION
# ============================================================

# Docker default: mysql service, database EduMeet.
# For local PowerShell execution, override DB_URL with your
# local MySQL connection URL.

spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/EduMeet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000


# ============================================================
# PHP CLASS DATABASE CONFIGURATION
# ============================================================

app.php-class-database.url=${PHP_CLASS_DATABASE_URL:jdbc:mysql://mysql:3306/EduMeet}
app.php-class-database.username=${PHP_CLASS_DATABASE_USERNAME:${DB_USER:root}}
app.php-class-database.password=${PHP_CLASS_DATABASE_PASSWORD:${DB_PASSWORD}}


# ============================================================
# JWT CONFIGURATION
# ============================================================

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000


# ============================================================
# PHP AUTHENTICATION ENDPOINTS
# ============================================================

app.php.login-url=http://localhost/edu-meet/php/api/auth/login.php
app.php.system-admin-login-url=http://localhost/edu-meet/php/api/auth/system_admin_login.php
app.php.school-login-url=http://localhost/edu-meet/php/api/auth/school_login.php
app.php.college-admin-login-url=http://localhost/edu-meet/php/api/auth/school_login.php
app.php.signup-url=http://localhost/edu-meet/php/api/auth/signup.php
app.php.base-url=http://localhost/edu-meet/php/api


# ============================================================
# REDIS CONFIGURATION
# ============================================================

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

app.auth.token-ttl-seconds=86400


# ============================================================
# LIVEKIT VIDEO CONFERENCE
# ============================================================

livekit.url=${LIVEKIT_URL}
livekit.api-key=${LIVEKIT_API_KEY}
livekit.api-secret=${LIVEKIT_API_SECRET}


# ============================================================
# MONGODB CONFIGURATION
# ============================================================

spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true


# ============================================================
# FRONTEND CORS CONFIGURATION
# ============================================================

app.frontend.allowed-origins=${EDUMEET_FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://edu-meet.app,https://edu-meet.app}
