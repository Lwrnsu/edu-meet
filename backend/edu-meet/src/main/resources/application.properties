spring.application.name=edu-meet
livekit.api-key=${LIVEKIT_API_KEY:}
livekit.api-secret=${LIVEKIT_API_SECRET:}
attendance.report-key=${ATTENDANCE_REPORT_KEY:}
spring.config.import=optional:file:../../.env[.properties]
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/edumeet}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

spring.datasource.url=jdbc:mysql://localhost:3306/edu_meet?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true