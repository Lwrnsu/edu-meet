server.port=8080

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
compiler.api.url=https://api.onlinecompiler.io/api/run-code-sync/
compiler.api.key=b705a20cead2db665e3f855f571ecd9e
spring.application.name=edu-meet

spring.datasource.url=jdbc:mysql://localhost:3306/EduMeet
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=edu-meet-dev-jwt-secret-key-change-me-32chars-min
app.jwt.expiration-ms=86400000

app.php.login-url=http://localhost/edu-meet/backend/edu-meet/php/api/auth/login.php
app.php.system-admin-login-url=http://localhost/edu-meet/backend/edu-meet/php/api/auth/system_admin_login.php
app.php.school-login-url=http://localhost/edu-meet/backend/edu-meet/php/api/auth/school_login.php
app.php.college-admin-login-url=http://localhost/edu-meet/backend/edu-meet/php/api/auth/school_login.php
app.php.signup-url=http://localhost/edu-meet/backend/edu-meet/php/api/auth/signup.php
app.php.base-url=http://localhost/edu-meet/backend/edu-meet/php/api

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
app.auth.token-ttl-seconds=86400
livekit.api-key=${LIVEKIT_API_KEY:}
livekit.api-secret=${LIVEKIT_API_SECRET:}
attendance.report-key=${ATTENDANCE_REPORT_KEY:}
spring.config.import=optional:file:../../.env[.properties]
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/edumeet}
