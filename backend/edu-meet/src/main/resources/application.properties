spring.application.name=edu-meet

spring.datasource.url=jdbc:mysql://localhost:3306/db_edu_meet
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=edu-meet-dev-jwt-secret-key-change-me-32chars-min
app.jwt.expiration-ms=86400000

app.php.login-url=http://localhost/edu-meet/backend/edu-meet/php/api/auth/login.php
app.php.base-url=http://localhost/edu-meet/backend/edu-meet/php/api
