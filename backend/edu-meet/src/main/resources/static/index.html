<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Edu-Meet Chat Prototype</title>
</head>
<body>
    <h2>Edu-Meet Chat</h2>

    <input id="name" placeholder="Your name">
    <br><br>
    <div id="messages" style="border:1px solid #999; height:300px; overflow-y:auto; padding:8px;"></div>
    <br>
    <input id="text" placeholder="Type a message" style="width:300px;">
    <button id="send">Send</button>

    <script>
        const protocol = location.protocol === "https:" ? "wss://" : "ws://";
        const ws = new WebSocket(protocol + location.host + "/chat");

        const messagesDiv = document.getElementById("messages");
        const nameInput = document.getElementById("name");
        const textInput = document.getElementById("text");

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            const div = document.createElement("div");
            div.textContent = msg.sender + ": " + msg.text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        };

        function sendMessage() {
            const text = textInput.value.trim();
            if (!text || ws.readyState !== WebSocket.OPEN) return;
            const sender = nameInput.value.trim() || "Anonymous";
            ws.send(JSON.stringify({ sender: sender, text: text }));
            textInput.value = "";
        }

        document.getElementById("send").onclick = sendMessage;
        textInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
