<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Edu-Meet Chat Prototype</title>
</head>
<body>
    <h2>Edu-Meet Chat</h2>

    <input id="userId" placeholder="User ID" style="width:260px;">
    <input id="conversationId" placeholder="Conversation ID" style="width:260px;">
    <button id="connect">Connect</button>
    <br><br>
    <div id="messages" style="border:1px solid #999; height:300px; overflow-y:auto; padding:8px;"></div>
    <br>
    <input id="text" placeholder="Type a message" style="width:300px;">
    <button id="send">Send</button>

    <script>
        let ws = null;
        const messagesDiv = document.getElementById("messages");
        const textInput = document.getElementById("text");

        function addLine(text) {
            const div = document.createElement("div");
            div.textContent = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        document.getElementById("connect").onclick = async () => {
            const userId = document.getElementById("userId").value.trim();
            const conversationId = document.getElementById("conversationId").value.trim();
            if (!userId || !conversationId) return;

            messagesDiv.textContent = "";
            const res = await fetch("/api/conversations/" + conversationId + "/messages");
            const history = await res.json();
            history.reverse().forEach(m => addLine(m.senderId + ": " + m.text));

            if (ws) ws.close();
            const protocol = location.protocol === "https:" ? "wss://" : "ws://";
            ws = new WebSocket(protocol + location.host + "/chat?userId=" + userId);
            ws.onmessage = (event) => {
                const m = JSON.parse(event.data);
                if (m.conversationId === conversationId) {
                    addLine(m.senderId + ": " + m.text);
                }
            };
        };

        function sendMessage() {
            const text = textInput.value.trim();
            const conversationId = document.getElementById("conversationId").value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({ conversationId: conversationId, text: text }));
            textInput.value = "";
        }

        document.getElementById("send").onclick = sendMessage;
        textInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
