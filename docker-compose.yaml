services: 
  frontend:
    build: ./frontend/edu-meet/
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/edu-meet/:/app
      - /app/node_modules

  spring:
    build: ./backend/edu-meet/
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
    depends_on: [redis]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  proxy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [frontend, spring]

volumes:
    caddy_data:
    redis_data:
