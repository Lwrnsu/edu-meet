services:
  frontend:
    build: ./frontend/edu-meet/
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://spring:8080
    volumes:
      - ./frontend/edu-meet/:/app
      - /app/node_modules
    depends_on:
      - spring

  spring:
    build: ./backend/edu-meet/
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: chat
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      ATTENDANCE_REPORT_KEY: ${ATTENDANCE_REPORT_KEY:-}
      COMPILER_API_URL: ${COMPILER_API_URL:-https://api.onlinecompiler.io/api/run-code-sync/}
      ONLINE_COMPILER: ${ONLINE_COMPILER:-}
      APP_PHP_LOGIN_URL: http://php:8000/api/auth/login.php
      APP_PHP_SYSTEM_ADMIN_LOGIN_URL: http://php:8000/api/auth/system_admin_login.php
      APP_PHP_SCHOOL_LOGIN_URL: http://php:8000/api/auth/school_login.php
      APP_PHP_SIGNUP_URL: http://php:8000/api/auth/signup.php
      APP_PHP_BASE_URL: http://php:8000/api
      APP_PHP_COMPILER_URL: http://php:8000/php_edumeet/
      PHP_CLASS_DATABASE_URL: ${PHP_CLASS_DATABASE_URL:-jdbc:mysql://mysql:3306/edu_meet}
      PHP_CLASS_DATABASE_USERNAME: ${PHP_CLASS_DATABASE_USERNAME:-root}
      PHP_CLASS_DATABASE_PASSWORD: ${PHP_CLASS_DATABASE_PASSWORD:-${MYSQL_ROOT_PASSWORD:-secret}}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/edu_meet
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
      REDIS_HOST: redis
      MONGODB_URI: mongodb://mongo:27017/edumeet
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      php:
        condition: service_started

  php:
    build: ./php/
    ports:
      - "8000:8000"
    environment:
      PHP_DB_HOST: mysql
      PHP_DB_NAME: edu_meet
      PHP_DB_USER: ${PHP_CLASS_DATABASE_USERNAME:-root}
      PHP_DB_PASSWORD: ${PHP_CLASS_DATABASE_PASSWORD:-${MYSQL_ROOT_PASSWORD:-secret}}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:26.10.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: edu_meet
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.10.3-alpine3.23
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --dir /data --protected-mode no
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  proxy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [frontend, spring]

volumes:
    caddy_data:
    mysql_data:
    redisdata:
    mongo_data:
