services: 
  frontend:
    build: ./frontend/edu-meet/
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/edu-meet/:/app
      - /app/node_modules

  spring:
    build: ./backend/edu-meet/
    ports:
      - "8080:8080"

  proxy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [frontend, spring]

volumes:
    caddy_data: